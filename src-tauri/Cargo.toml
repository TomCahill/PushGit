[package]
name = "pushgit"
version = "1.2.0"
description = "A fast, lightweight git GUI with a proper visual commit graph."
authors = ["Tom Cahill"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pushgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-cli = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "process", "time", "fs"] }
git2 = "0.19"
notify = "7"
notify-debouncer-full = "0.4"
directories = "5"
thiserror = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
keyring = "4.1.5"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
bytes = "1.12.1"
futures-util = "0.3.33"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
semver = "1"

[features]
# E2E-testing-only plugins — never enabled in a normal `tauri dev`/
# `tauri build`, only via `npm run test:e2e:build`'s `--features e2e`, so the WebDriver
# execute/mock backdoor and embedded WebDriver HTTP server never ship in a real build.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = "0.5"
wiremock = "0.6.5"

[[bench]]
name = "graph_layout"
harness = false

# Dependency debug info dominates link time on this dep tree (tauri/webkit2gtk/reqwest);
# own-crate debug info is kept via the profile.dev default.
[profile.dev.package."*"]
debug = 0

