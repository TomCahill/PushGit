name: Feature request
description: Suggest an idea or improvement for PushGit
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before requesting a feature, please check [CONTRIBUTING.md](../../CONTRIBUTING.md#before-you-start)
        for the project's locked decisions (Tauri, Linux-first, no cloud/telemetry) — requests that go
        against these will likely be declined regardless of how well-argued they are.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the underlying need, not just the proposed solution — this helps evaluate alternatives.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like PushGit to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or approaches you've tried or considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, links, or examples from other tools that illustrate the idea.
    validations:
      required: false
